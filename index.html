<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Count</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="app.css">
  <style>
    .form-wrap { max-width:46rem; }
    #sections fieldset { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem 1.1rem 1.1rem; margin:0 0 1rem; min-width:0; }
    #sections legend { float:left; width:100%; font-weight:700; font-size:1rem; padding:0; margin-bottom:.8rem; }
    #sections legend + * { clear:both; }
    .two-column { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media (max-width:560px) { .two-column { grid-template-columns:1fr; } }
    #sections label { display:block; font-weight:700; font-size:.8rem; margin-bottom:.3rem; }
    #sections input[type="text"] { width:100%; }
    .item { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.65rem 0; border-bottom:1px solid var(--line); }
    .item:first-of-type { border-top:1px solid var(--line); }
    #sections .item label { margin:0; font-weight:400; font-size:.95rem; }
    .stepper { display:flex; align-items:center; gap:.35rem; }
    .stepper input { width:4.5rem; text-align:center; -moz-appearance:textfield; }
    .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    .stepper button { width:2.2rem; height:2.2rem; font-size:1.1rem; font-weight:700; color:var(--good); background:var(--card);
      border:1px solid var(--line); border-radius:8px; cursor:pointer; }
    .stepper button:hover { border-color:var(--good); }
    .total { display:flex; justify-content:space-between; padding-top:.8rem; font-weight:700; }
    .actions { display:flex; gap:.6rem; flex-wrap:wrap; }
    #summary { margin-top:1rem; border-color:var(--good); }
    #summary table { width:100%; border-collapse:collapse; margin-top:.4rem; }
    #summary td { padding:.4rem 0; border-bottom:1px solid var(--line); }
    #summary td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
    #summary tr.sum td { font-weight:700; border-bottom:0; }
    #summary .actions { margin-top:1rem; }
  </style>
</head>
<body>
  <nav class="rail" aria-label="Main">
    <a href="dashboard.html" class="logo" aria-label="Stocktake home">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
    </a>
    <a href="dashboard.html" aria-label="Dashboard" title="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </a>
    <a href="index.html" aria-current="page" aria-label="New count" title="New count">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM12 11v6M9 14h6"/></svg>
    </a>
    <a href="review.html" aria-label="Review submissions" title="Review submissions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
    </a>
    <span class="spacer"></span>
    <a href="/.auth/logout" aria-label="Sign out" title="Sign out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
    </a>
  </nav>

  <main>
    <header class="page">
      <div>
        <div class="crumb">Stocktake · New count</div>
        <h1 id="title">New count</h1><span class="period" id="description"></span>
        <nav class="mobile-nav" aria-label="Pages"><a href="dashboard.html">Dashboard</a><a href="review.html">Review</a><a href="/.auth/logout">Sign out</a></nav>
      </div>
    </header>

    <div class="form-wrap">
      <form id="form" novalidate>
        <div id="sections"><div class="status">Loading form…</div></div>
        <div class="actions">
          <button type="submit" class="primary" id="submitBtn">Submit</button>
          <button type="reset" class="secondary">Clear form</button>
        </div>
        <p class="error" id="formError" role="alert"></p>
      </form>

      <section id="summary" class="card" hidden aria-live="polite">
        <h2>Count saved <em>✓</em></h2>
        <p class="sub" id="summaryName"></p>
        <table><tbody id="summaryRows"></tbody></table>
        <div class="actions">
          <button type="button" class="primary" id="pdfBtn">Download PDF</button>
          <a class="secondary" href="review.html" style="text-decoration:none">Review submissions</a>
        </div>
      </section>
    </div>
  </main>

  <script>
    // Everything on this page is built from form.json — edit that file to change the form.
    const el = (tag, props = {}, ...kids) => {
      const node = Object.assign(document.createElement(tag), props);
      kids.forEach(k => node.append(k));
      return node;
    };
    let config, textFields = [], numberFields = [], lastSubmission = null;

    const qty = f => {
      const n = parseInt(document.getElementById(f.id).value, 10);
      const min = f.min ?? 0, max = f.max ?? Infinity;
      return isNaN(n) ? min : Math.min(max, Math.max(min, n));
    };
    const updateTotals = () => document.querySelectorAll('[data-total]').forEach(t => {
      const ids = t.dataset.total.split(',');
      t.textContent = numberFields.filter(f => ids.includes(f.id)).reduce((s, f) => s + qty(f), 0);
    });

    function renderField(field) {
      if (field.type === 'integer') {
        numberFields.push(field);
        const input = el('input', { type:'number', id:field.id, name:field.id, value:field.default ?? 0,
          min:field.min ?? 0, step:1, inputMode:'numeric' });
        if (field.max != null) input.max = field.max;
        input.addEventListener('input', updateTotals);
        const step = d => el('button', { type:'button', textContent: d < 0 ? '−' : '+',
          ariaLabel:`${d < 0 ? 'Decrease' : 'Increase'} ${field.label.toLowerCase()}`,
          onclick: () => { input.value = qty(field) + d; input.value = qty(field); updateTotals(); } });
        return el('div', { className:'item' },
          el('label', { htmlFor:field.id, textContent:field.label }),
          el('div', { className:'stepper' }, step(-1), input, step(1)));
      }
      textFields.push(field);
      const input = el('input', { type:'text', id:field.id, name:field.id, required:!!field.required,
        maxLength:field.maxLength ?? 200, autocomplete:field.autocomplete ?? 'off' });
      return el('div', {},
        el('label', { htmlFor:field.id, textContent:field.label }),
        input,
        el('p', { className:'error', id:`${field.id}Error` }));
    }

    async function init() {
      try {
        const res = await fetch('form.json', { cache:'no-store' });
        if (!res.ok) throw new Error();
        config = await res.json();
      } catch {
        document.getElementById('sections').textContent = 'The form could not be loaded. Check that form.json is in the repository.';
        return;
      }
      document.title = config.title;
      document.getElementById('title').textContent = config.title;
      document.getElementById('description').textContent = config.description || '';
      document.getElementById('submitBtn').textContent = config.submitLabel || 'Submit';

      const container = document.getElementById('sections');
      container.innerHTML = '';
      config.sections.forEach(section => {
        const body = el('div', { className: section.layout === 'two-column' ? 'two-column' : '' },
          ...section.fields.map(renderField));
        const fs = el('fieldset', {}, el('legend', { textContent:section.title }), body);
        if (section.total) {
          const ids = section.fields.filter(f => f.type === 'integer').map(f => f.id).join(',');
          const out = el('span', { textContent:'0', ariaLive:'polite' });
          out.dataset.total = ids;
          fs.append(el('div', { className:'total' }, el('span', { textContent:section.total.label }), out));
        }
        container.append(fs);
      });
      updateTotals();
    }

    const form = document.getElementById('form');
    form.addEventListener('reset', () => {
      setTimeout(updateTotals, 0);
      document.getElementById('summary').hidden = true;
      document.querySelectorAll('.error').forEach(e => e.textContent = '');
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const formError = document.getElementById('formError');
      formError.textContent = '';
      const payload = {};
      let valid = true;
      textFields.forEach(f => {
        const v = document.getElementById(f.id).value.trim();
        const missing = f.required && !v;
        document.getElementById(`${f.id}Error`).textContent = missing ? (f.errorMessage || `Enter ${f.label.toLowerCase()}.`) : '';
        if (missing) valid = false;
        payload[f.id] = v;
      });
      numberFields.forEach(f => payload[f.id] = qty(f));
      if (!valid) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        const res = await fetch(config.submission.endpoint, {
          method: config.submission.method || 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'The count could not be saved. Try again.');

        lastSubmission = { payload, savedAt: new Date() };
        document.getElementById('summaryName').textContent =
          `Counted by ${textFields.map(f => payload[f.id]).join(' ')}`;
        const rows = document.getElementById('summaryRows');
        rows.innerHTML = '';
        numberFields.forEach(f => rows.append(el('tr', {}, el('td', { textContent:f.label }), el('td', { textContent:payload[f.id] }))));
        const sum = el('tr', { className:'sum' }, el('td', { textContent:'Total' }),
          el('td', { textContent: numberFields.reduce((s, f) => s + payload[f.id], 0) }));
        rows.append(sum);
        document.getElementById('summary').hidden = false;
        document.getElementById('summary').scrollIntoView({ behavior:'smooth', block:'nearest' });
      } catch (err) {
        formError.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = config.submitLabel || 'Submit';
      }
    });

    // Builds a PDF of the last saved count, entirely in the browser.
    function downloadPdf() {
      if (!lastSubmission || !window.jspdf) {
        document.getElementById('formError').textContent = 'The PDF could not be created. Reload the page and try again.';
        return;
      }
      const { payload, savedAt } = lastSubmission;
      const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      const left = 20, right = 190;
      let y = 28;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(22);
      doc.setTextColor(47, 107, 58);
      doc.text(config.title || 'Stock Count', left, y);

      y += 12;
      doc.setFontSize(11);
      doc.setTextColor(40, 40, 40);
      const name = textFields.map(f => payload[f.id]).join(' ');
      const when = savedAt.toLocaleString(undefined, { dateStyle: 'long', timeStyle: 'short' });
      doc.setFont('helvetica', 'bold'); doc.text('Counted by', left, y);
      doc.setFont('helvetica', 'normal'); doc.text(name, left + 32, y);
      y += 7;
      doc.setFont('helvetica', 'bold'); doc.text('Date', left, y);
      doc.setFont('helvetica', 'normal'); doc.text(when, left + 32, y);

      y += 16;
      doc.setFont('helvetica', 'bold');
      doc.text('Item', left, y);
      doc.text('Quantity', right, y, { align: 'right' });
      y += 3;
      doc.setDrawColor(47, 107, 58); doc.setLineWidth(0.6);
      doc.line(left, y, right, y);

      doc.setFont('helvetica', 'normal');
      doc.setDrawColor(207, 214, 204); doc.setLineWidth(0.3);
      numberFields.forEach(f => {
        y += 9;
        doc.text(f.label, left, y);
        doc.text(String(payload[f.id]), right, y, { align: 'right' });
        y += 3.5;
        doc.line(left, y, right, y);
      });

      y += 9;
      doc.setFont('helvetica', 'bold');
      doc.text('Total', left, y);
      doc.text(String(numberFields.reduce((s, f) => s + payload[f.id], 0)), right, y, { align: 'right' });

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(120, 120, 120);
      doc.text(`Generated ${new Date().toLocaleString()}`, left, 285);

      const stamp = savedAt.toISOString().slice(0, 10);
      const who = textFields.map(f => payload[f.id]).join('-').toLowerCase().replace(/[^a-z0-9-]+/g, '');
      doc.save(`stock-count-${stamp}${who ? '-' + who : ''}.pdf`);
    }
    document.getElementById('pdfBtn').addEventListener('click', downloadPdf);

    init();
  </script>
</body>
</html>
