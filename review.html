<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Submissions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="app.css">
  <style>
    .table-card { padding:.4rem .4rem .2rem; }
    .table-wrap { overflow-x:auto; }
    table.review { width:100%; border-collapse:collapse; min-width:46rem; font-size:.85rem; }
    table.review th { text-align:left; font-size:.7rem; color:var(--muted); font-weight:400; padding:.7rem .7rem .5rem; white-space:nowrap; border-bottom:1px solid var(--line); }
    table.review td { padding:.6rem .7rem; border-bottom:1px solid var(--line); vertical-align:middle; }
    table.review tr:last-child td { border-bottom:0; }
    .num, table.review th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .sub { display:block; color:var(--muted); font-size:.72rem; }
    td .badge { margin-left:.5rem; }
    .row-actions { display:flex; gap:.35rem; justify-content:flex-end; align-items:center; white-space:nowrap; }
    .row-actions .secondary { padding:.35rem .7rem; font-size:.78rem; }
    tr.editing td { background:var(--tint); }
    td input[type="number"] { width:5rem; text-align:right; padding:.35rem .5rem; }
    .panel td { background:var(--tint); padding:1rem; }
    .panel-grid { display:grid; grid-template-columns:1fr 2fr; gap:1rem; max-width:40rem; }
    @media (max-width:560px) { .panel-grid { grid-template-columns:1fr; } }
    .panel label { display:block; font-weight:700; font-size:.8rem; margin-bottom:.3rem; }
    .panel input[type="text"] { width:100%; }
    .panel .buttons { display:flex; gap:.5rem; margin-top:.8rem; }
    .panel .buttons .primary, .panel .buttons .secondary { padding:.45rem .9rem; }
    .history { margin:0; padding:0; list-style:none; }
    .history li { padding:.5rem 0; border-bottom:1px solid var(--line); }
    .history li:last-child { border-bottom:0; }
    .history .when { font-weight:700; }
  </style>
</head>
<body>
  <nav class="rail" aria-label="Main">
    <a href="dashboard.html" class="logo" aria-label="Stocktake home">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
    </a>
    <a href="dashboard.html" aria-label="Dashboard" title="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </a>
    <a href="index.html" aria-label="New count" title="New count">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM12 11v6M9 14h6"/></svg>
    </a>
    <a href="review.html" aria-current="page" aria-label="Review submissions" title="Review submissions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
    </a>
    <span class="spacer"></span>
    <a href="/.auth/logout" aria-label="Sign out" title="Sign out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
    </a>
  </nav>

  <main>
    <header class="page">
      <div>
        <div class="crumb">Stocktake · Review</div>
        <h1>Review submissions</h1><span class="period" id="summary"></span>
        <nav class="mobile-nav" aria-label="Pages"><a href="dashboard.html">Dashboard</a><a href="index.html">New count</a><a href="/.auth/logout">Sign out</a></nav>
      </div>
      <div class="controls">
        <button type="button" class="secondary" id="refresh">Refresh</button>
      </div>
    </header>

    <div id="status" class="status" aria-live="polite">Loading submissions…</div>

    <div id="content" hidden>
      <article class="card table-card">
        <div class="table-wrap">
          <table class="review">
            <thead id="head"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </article>
    </div>
  </main>

  <script>
    const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); kids.forEach(k => k != null && n.append(k)); return n; };
    const fmtDate = d => new Date(d).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });
    let items = [], nameFields = [], counts = [], signedInName = '', openPanel = null;

    async function init() {
      try {
        const cfg = await (await fetch('form.json', { cache:'no-store' })).json();
        const fields = cfg.sections.flatMap(s => s.fields);
        items = fields.filter(f => f.type === 'integer');
        nameFields = fields.filter(f => f.type === 'text');
      } catch {
        showStatus('The form settings could not be loaded. Check that form.json is in the repository.');
        return;
      }
      try {
        const me = await (await fetch('/.auth/me')).json();
        signedInName = me?.clientPrincipal?.userDetails || '';
      } catch {}
      load();
    }

    function showStatus(msg) {
      const s = document.getElementById('status');
      s.hidden = false; s.textContent = msg;
      document.getElementById('content').hidden = true;
    }

    async function load() {
      showStatus('Loading submissions…');
      try {
        const res = await fetch('/api/counts');
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Submissions could not be loaded. Try again.');
        counts = data;
        if (!counts.length) {
          document.getElementById('status').innerHTML = 'No submissions yet. <a href="index.html">Enter the first count</a>.';
          return;
        }
        document.getElementById('status').hidden = true;
        document.getElementById('content').hidden = false;
        render();
      } catch (err) { showStatus(err.message); }
    }

    const who = r => nameFields.map(f => r[f.id]).join(' ');
    const total = r => items.reduce((s, f) => s + (r[f.id] ?? 0), 0);

    function render() {
      openPanel = null;
      const edited = counts.filter(c => c.updatedAt).length;
      document.getElementById('summary').textContent =
        `${counts.length} submission${counts.length === 1 ? '' : 's'}${edited ? `, ${edited} recounted` : ''}`;

      const head = document.getElementById('head');
      head.innerHTML = '';
      head.append(el('tr', {},
        el('th', { textContent:'Counted' }), el('th', { textContent:'By' }),
        ...items.map(f => el('th', { className:'num', textContent:f.label })),
        el('th', { className:'num', textContent:'Total' }), el('th', {})));

      const rows = document.getElementById('rows');
      rows.innerHTML = '';
      counts.forEach(c => rows.append(viewRow(c)));
    }

    function viewRow(c) {
      const byCell = el('td', {}, who(c));
      if (c.updatedAt) byCell.append(el('span', { className:'badge', textContent:'Recounted' }));
      const tr = el('tr', {},
        el('td', {}, fmtDate(c.submittedAt),
          c.updatedAt ? el('span', { className:'sub', textContent:`Edited ${fmtDate(c.updatedAt)} by ${c.updatedBy}` }) : null),
        byCell,
        ...items.map(f => el('td', { className:'num', textContent:c[f.id] ?? 0 })),
        el('td', { className:'num', textContent:total(c) }),
        el('td', {}, el('div', { className:'row-actions' },
          el('button', { type:'button', className:'link', textContent:'History', onclick:() => showHistory(c, tr) }),
          el('button', { type:'button', className:'secondary', textContent:'PDF', onclick:e => downloadPdf(c, e.currentTarget),
            ariaLabel:`Download PDF of count from ${fmtDate(c.submittedAt)} by ${who(c)}` }),
          el('button', { type:'button', className:'secondary', textContent:'Edit', onclick:() => startEdit(c, tr),
            ariaLabel:`Edit count from ${fmtDate(c.submittedAt)} by ${who(c)}` }))));
      tr.dataset.id = c.id;
      return tr;
    }

    function closePanel() {
      if (!openPanel) return;
      const { row, panel, count } = openPanel;
      panel.remove();
      row.replaceWith(viewRow(count));
      openPanel = null;
    }

    function startEdit(c, tr) {
      closePanel();
      const inputs = {};
      const editRow = el('tr', { className:'editing' },
        el('td', {}, fmtDate(c.submittedAt)),
        el('td', {}, who(c)),
        ...items.map(f => {
          const input = el('input', { type:'number', min:f.min ?? 0, step:1, inputMode:'numeric', value:c[f.id] ?? 0,
            ariaLabel:`${f.label} recount` });
          if (f.max != null) input.max = f.max;
          inputs[f.id] = input;
          return el('td', { className:'num' }, input);
        }),
        el('td', { className:'num', textContent:'' }),
        el('td', {}));
      const totalCell = editRow.children[2 + items.length];
      const updateTotal = () => totalCell.textContent = items.reduce((s, f) => s + (parseInt(inputs[f.id].value, 10) || 0), 0);
      Object.values(inputs).forEach(i => i.addEventListener('input', updateTotal));
      updateTotal();

      const byInput = el('input', { type:'text', id:'recountBy', maxLength:100, value:signedInName, autocomplete:'name' });
      if (signedInName) byInput.readOnly = true;
      const noteInput = el('input', { type:'text', id:'recountNote', maxLength:200, placeholder:'Recount' });
      const error = el('p', { className:'error', role:'alert' });
      const saveBtn = el('button', { type:'button', className:'primary', textContent:'Save recount' });
      [...Object.values(inputs), byInput, noteInput].forEach(i => i.addEventListener('input', () => error.textContent = ''));
      const cancelBtn = el('button', { type:'button', className:'secondary', textContent:'Cancel', onclick:closePanel });

      const panel = el('tr', { className:'panel' }, el('td', { colSpan: 4 + items.length },
        el('div', { className:'panel-grid' },
          el('div', {}, el('label', { htmlFor:'recountBy', textContent:'Recounted by' }), byInput),
          el('div', {}, el('label', { htmlFor:'recountNote', textContent:'Reason (optional)' }), noteInput)),
        error,
        el('div', { className:'buttons' }, saveBtn, cancelBtn)));

      saveBtn.onclick = async () => {
        error.textContent = '';
        const payload = { version:c.version, updatedBy:byInput.value.trim(), note:noteInput.value.trim() };
        for (const f of items) {
          const n = Number(inputs[f.id].value);
          if (!Number.isInteger(n) || n < (f.min ?? 0) || (f.max != null && n > f.max)) {
            error.textContent = `${f.label} must be a whole number of ${f.min ?? 0} or more.`;
            inputs[f.id].focus(); return;
          }
          payload[f.id] = n;
        }
        if (!payload.updatedBy) { error.textContent = 'Enter who did the recount.'; byInput.focus(); return; }
        if (items.every(f => payload[f.id] === (c[f.id] ?? 0))) { error.textContent = 'No quantities have changed.'; return; }

        saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
        try {
          const res = await fetch(`/api/counts/${c.id}`, {
            method:'PUT', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(payload) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'The recount could not be saved. Try again.');
          const i = counts.findIndex(x => x.id === c.id);
          counts[i] = data;
          openPanel.count = data;
          closePanel();
          render();
        } catch (err) {
          error.textContent = err.message;
          saveBtn.disabled = false; saveBtn.textContent = 'Save recount';
        }
      };

      tr.replaceWith(editRow);
      editRow.after(panel);
      openPanel = { row:editRow, panel, count:c };
      inputs[items[0].id].focus();
    }

    async function showHistory(c, tr) {
      closePanel();
      const list = el('ul', { className:'history' }, el('li', { textContent:'Loading history…' }));
      const panel = el('tr', { className:'panel' }, el('td', { colSpan: 4 + items.length },
        list, el('div', { className:'buttons' }, el('button', { type:'button', className:'secondary', textContent:'Close', onclick:closePanel }))));
      const row = document.querySelector(`tr[data-id="${c.id}"]`) || tr;
      row.after(panel);
      openPanel = { row, panel, count:c };
      try {
        const res = await fetch(`/api/counts/${c.id}/history`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'History could not be loaded.');
        list.innerHTML = '';
        data.forEach((v, i) => {
          const isOriginal = i === data.length - 1;
          const label = i === 0 ? 'Current' : isOriginal ? 'Original count' : 'Earlier version';
          const whoText = isOriginal ? `by ${who(c)}` : `by ${v.updatedBy}${v.editNote ? ` · ${v.editNote}` : ''}`;
          list.append(el('li', {},
            el('span', { className:'when', textContent:`${label}: ` }),
            items.map(f => `${f.label} ${v[f.id]}`).join(', '),
            el('span', { className:'sub', textContent:`${fmtDate(isOriginal ? c.submittedAt : v.validFrom)} ${whoText}` })));
        });
      } catch (err) {
        list.innerHTML = '';
        list.append(el('li', { className:'error', textContent:err.message }));
      }
    }

    // PDF of one count. Recounted counts also get their change history.
    async function downloadPdf(c, btn) {
      if (!window.jspdf) { alert('The PDF tool could not load. Reload the page and try again.'); return; }
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = '…';
      let history = [];
      if (c.updatedAt) {
        try {
          const res = await fetch(`/api/counts/${c.id}/history`);
          if (res.ok) history = await res.json();
        } catch {}
      }
      try {
        buildPdf(c, history);
      } finally {
        btn.disabled = false; btn.textContent = label;
      }
    }

    function buildPdf(c, history) {
      const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
      const left = 20, right = 190, labelW = 34;
      let y = 28;
      const newPageIfNeeded = need => { if (y + need > 275) { doc.addPage(); y = 25; } };
      const pair = (k, v) => {
        doc.setFont('helvetica', 'bold'); doc.text(k, left, y);
        doc.setFont('helvetica', 'normal');
        const lines = doc.splitTextToSize(String(v), right - left - labelW);
        doc.text(lines, left + labelW, y);
        y += 6.5 * lines.length;
      };

      doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(47, 107, 58);
      doc.text('Stock Count', left, y);
      if (c.updatedAt) {
        doc.setFontSize(10); doc.setTextColor(138, 90, 0);
        doc.text('RECOUNTED', right, y, { align:'right' });
      }

      y += 12; doc.setFontSize(11); doc.setTextColor(40, 40, 40);
      pair('Count ID', `#${c.id}`);
      pair('Counted by', who(c));
      pair('Counted on', new Date(c.submittedAt).toLocaleString(undefined, { dateStyle:'long', timeStyle:'short' }));
      if (c.updatedAt) {
        pair('Recounted by', c.updatedBy || '');
        pair('Recounted on', new Date(c.updatedAt).toLocaleString(undefined, { dateStyle:'long', timeStyle:'short' }));
        if (c.editNote) pair('Reason', c.editNote);
      }

      y += 8;
      doc.setFont('helvetica', 'bold');
      doc.text(c.updatedAt ? 'Item (current count)' : 'Item', left, y);
      doc.text('Quantity', right, y, { align:'right' });
      y += 3; doc.setDrawColor(47, 107, 58); doc.setLineWidth(0.6); doc.line(left, y, right, y);
      doc.setFont('helvetica', 'normal'); doc.setDrawColor(207, 214, 204); doc.setLineWidth(0.3);
      items.forEach(f => {
        y += 9; doc.text(f.label, left, y);
        doc.text(String(c[f.id] ?? 0), right, y, { align:'right' });
        y += 3.5; doc.line(left, y, right, y);
      });
      y += 9; doc.setFont('helvetica', 'bold');
      doc.text('Total', left, y); doc.text(String(total(c)), right, y, { align:'right' });

      if (history.length > 1) {
        y += 16; newPageIfNeeded(30);
        doc.setFontSize(13); doc.setTextColor(47, 107, 58);
        doc.text('Change history', left, y);
        doc.setFontSize(10); doc.setTextColor(40, 40, 40);
        y += 3; doc.setDrawColor(47, 107, 58); doc.setLineWidth(0.6); doc.line(left, y, right, y);
        doc.setDrawColor(207, 214, 204); doc.setLineWidth(0.3);
        history.forEach((v, i) => {
          const isOriginal = i === history.length - 1;
          const title = i === 0 ? 'Current' : isOriginal ? 'Original count' : 'Earlier version';
          const when = new Date(isOriginal ? c.submittedAt : v.validFrom).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });
          const by = isOriginal ? who(c) : `${v.updatedBy || ''}${v.editNote ? ' · ' + v.editNote : ''}`;
          const qty = items.map(f => `${f.label} ${v[f.id]}`).join(',  ') +
            `  (total ${items.reduce((s, f) => s + (v[f.id] ?? 0), 0)})`;
          newPageIfNeeded(20);
          y += 7; doc.setFont('helvetica', 'bold'); doc.text(title, left, y);
          doc.setFont('helvetica', 'normal'); doc.text(when, right, y, { align:'right' });
          y += 5.5; doc.text(doc.splitTextToSize(qty, right - left), left, y);
          y += 5; doc.setTextColor(110, 110, 110); doc.text(doc.splitTextToSize(`by ${by}`, right - left), left, y);
          doc.setTextColor(40, 40, 40);
          y += 3.5; doc.line(left, y, right, y);
        });
      }

      const pages = doc.getNumberOfPages();
      for (let i = 1; i <= pages; i++) {
        doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(120, 120, 120);
        doc.text(`Generated ${new Date().toLocaleString()}`, left, 287);
        if (pages > 1) doc.text(`Page ${i} of ${pages}`, right, 287, { align:'right' });
      }

      const stamp = new Date(c.submittedAt).toISOString().slice(0, 10);
      const name = who(c).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      doc.save(`stock-count-${c.id}-${stamp}${name ? '-' + name : ''}.pdf`);
    }

    document.getElementById('refresh').addEventListener('click', load);
    init();
  </script>
</body>
</html>
