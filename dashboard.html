<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root { --paper:#FBFBF8; --ink:#1F2A1F; --muted:#5E6B5E; --leaf:#2F6B3A; --line:#CFD6CC; }
    @media (prefers-color-scheme: dark) { :root { --paper:#161B16; --ink:#E8EDE6; --muted:#A3AFA2; --leaf:#7CC08A; --line:#3A453A; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink);
      font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; font-size:1.0625rem; line-height:1.5; }
    main { max-width:60rem; margin:0 auto; padding:3rem 1.25rem 4rem; }
    h1 { font-size:2.25rem; line-height:1.1; margin:0 0 .5rem; color:var(--leaf); }
    h2 { font-size:1.25rem; margin:0 0 1rem; }
    .intro { color:var(--muted); margin:0 0 2.5rem; }
    a { color:var(--leaf); font-weight:700; }
    a:focus-visible, button:focus-visible { outline:3px solid var(--leaf); outline-offset:2px; }
    .latest { display:grid; grid-template-columns:repeat(auto-fit, minmax(10rem, 1fr)); gap:1rem; margin-bottom:1rem; }
    .stat { border-left:5px solid var(--c); padding:.25rem 0 .25rem 1rem; }
    .stat .n { font-size:2.5rem; font-weight:700; line-height:1.1; }
    .stat .l { color:var(--muted); }
    .meta { color:var(--muted); margin:0 0 3rem; font-size:.95rem; }
    section { margin-bottom:3rem; }
    .chart-box { position:relative; height:320px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:32rem; }
    th, td { text-align:left; padding:.55rem .5rem; border-bottom:1px solid var(--line); }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .status { padding:1.25rem; border:1.5px solid var(--line); border-radius:6px; }
    .refresh { font:inherit; font-weight:700; color:var(--ink); background:transparent;
      border:1.5px solid var(--line); border-radius:6px; padding:.55rem 1rem; cursor:pointer; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Stock Dashboard</h1>
    <p class="intro">Latest stock on hand and how counts have changed over time. <a href="index.html">Enter a new count</a></p>

    <div id="status" class="status" aria-live="polite">Loading counts…</div>

    <div id="content" hidden>
      <div class="latest" id="latest"></div>
      <p class="meta" id="latestMeta"></p>

      <section>
        <h2>Stock over time</h2>
        <div class="chart-box"><canvas id="trendChart" aria-label="Line chart of stock counts over time"></canvas></div>
      </section>

      <section>
        <h2>Counts by person</h2>
        <div class="chart-box"><canvas id="personChart" aria-label="Bar chart of counts submitted by each person"></canvas></div>
      </section>

      <section>
        <h2>All submissions</h2>
        <div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
      </section>

      <button class="refresh" id="refresh" type="button">Refresh data</button>
    </div>
  </main>

  <script>
    // Item names and colours come from form.json, data from /api/counts.
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const fmtDate = d => new Date(d).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });
    const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); kids.forEach(k => n.append(k)); return n; };
    let items = [], nameFields = [], charts = [];

    async function load() {
      const status = document.getElementById('status'), content = document.getElementById('content');
      status.hidden = false; status.textContent = 'Loading counts…';
      try {
        if (!items.length) {
          const cfg = await (await fetch('form.json', { cache:'no-store' })).json();
          const fields = cfg.sections.flatMap(s => s.fields);
          items = fields.filter(f => f.type === 'integer');
          nameFields = fields.filter(f => f.type === 'text');
        }
        const res = await fetch('/api/counts');
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Counts could not be loaded. Try again.');
        if (!data.length) {
          status.innerHTML = 'No counts yet. <a href="index.html">Enter the first count</a> and it will appear here.';
          content.hidden = true; return;
        }
        status.hidden = true; content.hidden = false;
        render(data);
      } catch (err) {
        status.textContent = err.message || 'Something went wrong loading the dashboard.';
        content.hidden = true;
      }
    }

    const who = r => nameFields.map(f => r[f.id]).join(' ');

    function render(data) {
      const latest = data[0];
      const latestBox = document.getElementById('latest');
      latestBox.innerHTML = '';
      items.forEach(f => {
        const s = el('div', { className:'stat' }, el('div', { className:'n', textContent:latest[f.id] ?? 0 }), el('div', { className:'l', textContent:f.label }));
        s.style.setProperty('--c', f.color || css('--leaf'));
        latestBox.append(s);
      });
      document.getElementById('latestMeta').textContent = `Latest count by ${who(latest)} on ${fmtDate(latest.submittedAt)}`;

      const head = document.getElementById('head');
      head.innerHTML = '';
      head.append(el('tr', {}, el('th', { textContent:'Date' }), el('th', { textContent:'Counted by' }),
        ...items.map(f => el('th', { className:'num', textContent:f.label }))));
      const rows = document.getElementById('rows');
      rows.innerHTML = '';
      data.forEach(r => rows.append(el('tr', {}, el('td', { textContent:fmtDate(r.submittedAt) }), el('td', { textContent:who(r) }),
        ...items.map(f => el('td', { className:'num', textContent:r[f.id] ?? 0 })))));

      charts.forEach(c => c.destroy()); charts = [];
      Chart.defaults.font.family = '"Atkinson Hyperlegible", system-ui, sans-serif';
      Chart.defaults.color = css('--muted');
      Chart.defaults.borderColor = css('--line');

      const oldest = [...data].reverse();
      charts.push(new Chart(document.getElementById('trendChart'), {
        type:'line',
        data: { labels: oldest.map(r => fmtDate(r.submittedAt)),
          datasets: items.map(f => ({ label:f.label, data:oldest.map(r => r[f.id] ?? 0), borderColor:f.color, backgroundColor:f.color, tension:.25, pointRadius:3, borderWidth:2.5 })) },
        options: { maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
          scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } }, x:{ ticks:{ maxTicksLimit:8 } } },
          plugins:{ legend:{ labels:{ color:css('--ink') } } } }
      }));

      const per = {};
      data.forEach(r => { const n = who(r); per[n] = (per[n] || 0) + 1; });
      const people = Object.entries(per).sort((a, b) => b[1] - a[1]);
      charts.push(new Chart(document.getElementById('personChart'), {
        type:'bar',
        data: { labels: people.map(p => p[0]), datasets:[{ label:'Counts submitted', data:people.map(p => p[1]), backgroundColor:css('--leaf'), borderRadius:4 }] },
        options: { maintainAspectRatio:false, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } }, plugins:{ legend:{ display:false } } }
      }));
    }

    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
